send:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mast
    title:
      required: false
      example: "Freezer warming"
      selector:
        text:
    body:
      required: false
      example: "Garage freezer is at -8 C and rising."
      selector:
        text:
          multiline: true
    priority:
      required: false
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - quiet
            - normal
            - loud
            - page
    url:
      required: false
      example: "https://my.home-assistant.io/redirect/entity/?entity_id=sensor.freezer"
      selector:
        text:
          type: url
    url_title:
      required: false
      selector:
        text:
    key:
      required: false
      example: "freezer-warm"
      selector:
        text:
    sound:
      required: false
      selector:
        text:
    retry:
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 30
          unit_of_measurement: s
          mode: box
    expire:
      required: false
      selector:
        number:
          min: 0
          max: 604800
          step: 60
          unit_of_measurement: s
          mode: box
    ack:
      required: false
      default: false
      selector:
        boolean:
    silent:
      required: false
      default: false
      selector:
        boolean:

