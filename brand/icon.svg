    <circle cx="58" cy="298" r="58.5"/>
    <circle cx="538" cy="298" r="58.5"/>
    <circle cx="58" cy="538" r="58.5"/>
    <circle cx="298" cy="538" r="58.5"/>
    <circle cx="538" cy="538" r="58.5"/>
  </g>
  <circle cx="298" cy="298" r="98.5" fill="none" stroke="#ff453a" stroke-opacity=".55" stroke-width="15"/>
