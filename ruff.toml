# Home Assistant core's own lint rules, lifted from its pyproject.toml so this
# integration reads like the components it sits next to. One deliberate
# difference: core bans `from __future__ import annotations` because it runs on
# Python 3.14, and hacs.json here declares Home Assistant 2025.8.0, so the
# import stays and flake8-tidy-imports is not enabled.
target-version = "py313"

[lint]
select = ["A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011", "E", "F", "F541", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG", "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S107", "S102", "S103", "S108", "S301", "S306", "S307", "S313", "S314", "S315", "S316", "S317", "S318", "S319", "S601", "S602", "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID", "TRY", "UP", "UP031", "UP032", "W"]
ignore = ["ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019", "D202", "D203", "D213", "D406", "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW1641", "PLW2901", "PT011", "PT018", "RUF001", "RUF012", "RUF015", "RUF043", "SIM102", "SIM103", "SIM108", "SIM115", "TC001", "TC002", "TC003", "TC006", "TRY003", "TRY400", "UP047", "UP049", "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819", "PLE0605", "FURB116", "ISC004", "LOG004"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 25
